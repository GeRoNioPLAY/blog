{% extends "base.html" %}

{% block title %}Все посты{% endblock title %}
{% block content %}
    <div class="flex flex-col gap-4">
        <h1 class="text-3xl font-bold">Лента постов</h1>
        {% for post in posts %}
            <div class="card bg-base-100 shadow-md">
                <div class="card-body">
                    <h2 class="card-title">{{ post.title }}</h2>
                    <p class="text-base-content/70">{{ post.content[:150] }}...</p>
                    <div class="card-actions justify-end">
                        <a href="{{ url_for('post_detail', post_id=post.id) }}"
                           class="btn btn-primary btn-sm">Читать</a>
                    </div>
                </div>
            </div>
        {% else %}
            <div class="alert alert-info">Постов пока нет.</div>
        {% endfor %}
    </div>
{% endblock content %}
