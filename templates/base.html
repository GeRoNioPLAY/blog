<!DOCTYPE html>
<html lang="ru" data-theme="light">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Блог{% endblock title %}</title>
        <link rel="stylesheet"
              href="{{ url_for('static', path='css/output.css') }}">
        <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
        <script src="https://unpkg.com/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
    </head>
    <body class="min-h-screen bg-base-200">
        <nav class="navbar bg-base-100 shadow-md px-4">
            <div class="flex-1">
                <a href="{{ url_for('post_list') }}" class="text-xl font-bold">📝 Блог</a>
            </div>
            <div class="flex-none">
                <a href="{{ url_for('post_create') }}" class="btn btn-primary btn-sm">Новый пост</a>
            </div>
        </nav>
        <main class="container mx-auto px-4 py-8 max-w-4xl">
            {% block content %}
            {% endblock content %}
        </main>
    </body>
</html>
